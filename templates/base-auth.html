<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MMU Lost &amp; Found{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* The image path needs url_for, so it can't live in style.css */
        body.auth-body {
            background-image: url("{{ url_for('static', filename='images/campus.jpg') }}");
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body class="auth-body">
    <div class="page-overlay">
        <div class="auth-card">
            <div class="auth-title">{% block heading %}{% endblock %}</div>
            <div class="auth-subtitle">{% block subheading %}{% endblock %}</div>

            {% with messages = get_flashed_messages() %}
                {% for msg in messages %}
                    <div class="flash-message">{{ msg }}</div>
                {% endfor %}
            {% endwith %}

            {% block content %}{% endblock %}

            <div class="auth-footer">{% block footer %}{% endblock %}</div>
        </div>
    </div>
</body>
</html>
